<button type="button" onclick="signOut()" class="btn" style="background-color: #8b0000; color: #fff; padding: 10px 20px; border: none; cursor: pointer;">Odhlásit se</button>
</div>

<p id="status" style="margin-top: 15px; font-weight: bold; color: #104246;"></p>

<!-- JAVASCRIPT LOGIKA -->
<script>
const SUPABASE_URL = 'https://pgbyzfnctvwxdiwncvtt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pNVWleewg1y9WY3X5dLcyw_4VWyFTOc';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// NOVOST: Funkce, která schová formulář po přihlášení
async function updateUI() {
const { data: { user } } = await supabaseClient.auth.getUser();

const authForm = document.getElementById('auth-form');
const userProfile = document.getElementById('user-profile');
const welcomeMessage = document.getElementById('welcome-message');
const postFormContainer = document.getElementById('post-form-container');
const loginNotice = document.getElementById('login-notice');

if (user) {
authForm.style.display = 'none';
userProfile.style.display = 'block';

const username = user.user_metadata?.username || user.email;
const role = user.user_metadata?.role;

welcomeMessage.innerHTML = `Vítej zpět, uživateli <strong>${username}</strong>!${role === 'admin' ? '👑 (Admin)' : ''}`;
if (postFormContainer) postFormContainer.style.display = 'block';
if (loginNotice) loginNotice.style.display = 'none';
} else {
authForm.style.display = 'block';
userProfile.style.display = 'none';

if (postFormContainer) postFormContainer.style.display = 'none';
if (loginNotice) loginNotice.style.display = 'block';
}
}

async function signUp() {
const username = document.getElementById('username').value;
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

if (!username) {
document.getElementById('status').innerText = 'Chyba: Zadaj přezdívku!';
return;
}

const { data, error } = await supabaseClient.auth.signUp({
email: email,
password: password,
options: {
data: {
username: username
}
}
});

if (error) {
document.getElementById('status').innerText = 'Chyba: ' + error.message;
} else {
document.getElementById('status').innerText = 'Registrace byla úspěšná! Zkontroluj svůj e-mail a potvrď registraci účtu.';
}
}

async function signIn() {
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

if (error) {
document.getElementById('status').innerText = 'Chyba: ' + error.message;
} else {
document.getElementById('status').innerText = '';
updateUI(); // NOVOST: Aktualizuje rozhraní po přihlášení
}
}

// NOVOST: Odhlášení
async function signOut() {
await supabaseClient.auth.signOut();
document.getElementById('status').innerText = 'Byl jsi odhlášen.';
updateUI();
}

// Spustí kontrolu stavu přihlášení při načtení stránky
updateUI();
</script></nav>

<script>
const postInput = document.getElementById('post-input');
const charCount = document.getElementById('char-count');

function updateCharCount() {
    if (!postInput || !charCount) return;
    charCount.innerText = 200 - postInput.value.length;
}

postInput.addEventListener('input', updateCharCount);

function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
